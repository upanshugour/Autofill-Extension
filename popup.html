<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { width: 280px; margin: 0; padding: 16px; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: #1b2433; background: #f7f8fa; }
  h1 { font-size: 15px; margin: 0 0 12px; font-weight: 650; }
  button { width: 100%; padding: 10px; font: inherit; font-weight: 600; border: 0; border-radius: 6px; background: #1f4fd8; color: #fff; cursor: pointer; }
  button:hover { background: #1a43b8; }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid #1f4fd8; outline-offset: 2px; }
  label { display: flex; gap: 8px; align-items: center; margin: 12px 0; font-size: 13px; }
  #status { min-height: 18px; margin-top: 10px; font-size: 13px; color: #44506a; }
  #review { margin: 6px 0 0; padding-left: 18px; font-size: 12px; color: #8a5a0a; }
  a { color: #1f4fd8; font-size: 13px; }
</style></head><body>
  <h1>Application Autofill</h1>
  <button id="go">Fill this page</button>
  <label><input type="checkbox" id="ai" checked> Draft open questions with Claude</label>
  <div id="status"></div>
  <ul id="review"></ul>
  <p><a href="#" id="opts">Edit profile and settings</a></p>
  <script src="popup.js"></script>
</body></html>
